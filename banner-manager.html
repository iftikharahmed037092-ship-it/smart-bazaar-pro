<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SmartBazaar Pro - Banner Manager</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="banner-manager.css">

</head>


<body>


<!--==================================================
SMARTBAZAAR PRO
BANNER MANAGER
==================================================-->

<div class="banner-manager">


<!--==============================
HEADER
==============================-->

<header class="banner-manager-header">

    <div>

        <h1>
            Banner Manager
        </h1>

        <p>
            Add and manage website banners
        </p>

    </div>


    <a href="admin-dashboard.html">

        <i class="fa-solid fa-arrow-left"></i>

        Dashboard

    </a>

</header>



<!--==============================
MAIN
==============================-->

<main class="banner-manager-content">


<!--==============================
ADD BANNER
==============================-->

<section class="banner-form-card">

    <h2>

        <i class="fa-solid fa-image"></i>

        Add New Banner

    </h2>


    <form id="bannerForm">


        <!-- IMAGE -->

        <div class="form-group">

            <label>

                Banner Image

            </label>


            <!--label
            for="bannerImage"
            class="image-upload-box"-->

                <button
    type="button"
    class="image-upload-box"
    onclick="document.getElementById('bannerImage').click()">

    <i class="fa-solid fa-cloud-arrow-up"></i>

    <strong>
        Choose Image
    </strong>

    <span>
        Select image from Gallery
    </span>

                </button>

                <i class="fa-solid fa-cloud-arrow-up"></i>

                <strong>
                    Choose Image
                </strong>

                <span>
                    Select image from Gallery
                </span>

            </label>


            <input
            type="file"
            id="bannerImage"
            accept="image/*"
            >


            <div
            id="imagePreview"
            class="image-preview">

            </div>

        </div>



        <!-- TITLE -->

        <div class="form-group">

            <label for="bannerTitle">

                Banner Title

            </label>


            <input
            type="text"
            id="bannerTitle"
            placeholder="Example: Mega Summer Sale"
            required>

        </div>



        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="bannerDescription">

                Description

            </label>


            <textarea
            id="bannerDescription"
            rows="4"
            placeholder="Write banner description">

            </textarea>

        </div>



        <!-- BADGE -->

        <div class="form-group">

            <label for="bannerBadge">

                Badge / Tag

            </label>


            <input
            type="text"
            id="bannerBadge"
            placeholder="Example: HOT DEAL">

        </div>



        <!-- BUTTON -->

        <div class="form-group">

            <label for="bannerButtonText">

                Button Text

            </label>


            <input
            type="text"
            id="bannerButtonText"
            value="Shop Now">

        </div>



        <!-- BUTTON LINK -->

        <div class="form-group">

            <label for="bannerButtonLink">

                Button Link

            </label>


            <input
            type="text"
            id="bannerButtonLink"
            placeholder="Example: products.html">

        </div>



        <!-- STATUS -->

        <div class="form-group">

            <label for="bannerStatus">

                Banner Status

            </label>


            <select id="bannerStatus">

                <option value="active">

                    Active

                </option>


                <option value="inactive">

                    Inactive

                </option>

            </select>

        </div>



        <!-- SAVE -->

        <button
        type="submit"
        id="saveBannerBtn"
        class="save-banner-btn">

            <i class="fa-solid fa-cloud-arrow-up"></i>

            Upload & Save Banner

        </button>


        <!-- MESSAGE -->

        <div
        id="bannerMessage"
        class="banner-message">

        </div>


    </form>

</section>



<!--==============================
BANNER LIST
==============================-->

<section class="banner-list-card">

    <h2>

        <i class="fa-solid fa-images"></i>

        Saved Banners

    </h2>


    <div
    id="bannerList"
    class="banner-list">

        <p class="empty-message">

            No banners added yet.

        </p>

    </div>

</section>


</main>


</div>



<!--==============================
JAVASCRIPT
==============================-->

<script
type="module"
src="banner-manager.js">
</script>


</body>

</html>
