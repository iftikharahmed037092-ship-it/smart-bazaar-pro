<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartBazaar Pro - Banner Manager</title>

    <!--==================================================
    SMARTBAZAAR PRO
    FEATURE — BANNER MANAGEMENT
    FONT AWESOME
    ==================================================-->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!--==================================================
    SMARTBAZAAR PRO
    FEATURE — BANNER MANAGEMENT
    CSS
    ==================================================-->

    <link
        rel="stylesheet"
        href="banner-manager.css"
    >

</head>


<body>


<!--==================================================
SMARTBAZAAR PRO
FEATURE — BANNER MANAGEMENT
BANNER MANAGER
==================================================-->

<div class="banner-manager">


    <!--==================================================
    HEADER
    ==================================================-->

    <header class="banner-manager-header">

        <div class="header-info">

            <h1>
                <i class="fa-solid fa-images"></i>
                Banner Manager
            </h1>

            <p>
                Add and manage website banners
            </p>

        </div>


        <a
            href="admin-dashboard.html"
            class="dashboard-btn"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

    </header>



    <!--==================================================
    MAIN CONTENT
    ==================================================-->

    <main class="banner-manager-content">


        <!--==================================================
        FEATURE — BANNER MANAGEMENT
        ADD NEW BANNER
        ==================================================-->

        <section class="banner-form-card">

            <div class="card-heading">

                <div class="heading-icon">

                    <i class="fa-solid fa-image"></i>

                </div>

                <div>

                    <h2>
                        Add New Banner
                    </h2>

                    <p>
                        Upload a banner for your homepage
                    </p>

                </div>

            </div>


            <!--==================================================
            BANNER FORM
            ==================================================-->

            <form id="bannerForm">


                <!--==================================================
                FEATURE — BANNER IMAGE
                ==================================================-->

                <div class="form-group">

                    <label class="field-label">
                        Banner Image
                    </label>


                    <!--
                    IMPORTANT:
                    This button ONLY opens the device gallery.
                    Firebase and Cloudinary are NOT involved here.
                    -->

                    <button
                        type="button"
                        id="bannerImageButton"
                        class="image-upload-box"
                    >

                        <span class="upload-icon">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                        </span>


                        <strong>
                            Choose Image
                        </strong>


                        <span class="upload-text">
                            Select image from Gallery
                        </span>


                        <small>
                            JPG, PNG, WEBP • Maximum 10MB
                        </small>

                    </button>


                    <!--==================================================
                    HIDDEN FILE INPUT
                    ==================================================-->

                    <input
                        type="file"
                        id="bannerImage"
                        accept="image/*"
                        hidden
                    >


                    <!--==================================================
                    IMAGE PREVIEW
                    ==================================================-->

                    <div
                        id="imagePreview"
                        class="image-preview"
                    ></div>

                </div>



                <!--==================================================
                BANNER TITLE
                ==================================================-->

                <div class="form-group">

                    <label
                        for="bannerTitle"
                        class="field-label"
                    >
                        Banner Title
                    </label>


                    <input
                        type="text"
                        id="bannerTitle"
                        placeholder="Example: Mega Summer Sale"
                        required
                    >

                </div>



                <!--==================================================
                DESCRIPTION
                ==================================================-->

                <div class="form-group">

                    <label
                        for="bannerDescription"
                        class="field-label"
                    >
                        Description
                    </label>


                    <textarea
                        id="bannerDescription"
                        rows="4"
                        placeholder="Write banner description"
                    ></textarea>

                </div>



                <!--==================================================
                BADGE
                ==================================================-->

                <div class="form-group">

                    <label
                        for="bannerBadge"
                        class="field-label"
                    >
                        Badge / Tag
                    </label>


                    <input
                        type="text"
                        id="bannerBadge"
                        placeholder="Example: HOT DEAL"
                    >

                </div>



                <!--==================================================
                BUTTON TEXT
                ==================================================-->

                <div class="form-group">

                    <label
                        for="bannerButtonText"
                        class="field-label"
                    >
                        Button Text
                    </label>


                    <input
                        type="text"
                        id="bannerButtonText"
                        value="Shop Now"
                    >

                </div>



                <!--==================================================
                BUTTON LINK
                ==================================================-->

                <div class="form-group">

                    <label
                        for="bannerButtonLink"
                        class="field-label"
                    >
                        Button Link
                    </label>


                    <input
                        type="text"
                        id="bannerButtonLink"
                        placeholder="Example: products.html"
                    >

                </div>



                <!--==================================================
                STATUS
                ==================================================-->

                <div class="form-group">

                    <label
                        for="bannerStatus"
                        class="field-label"
                    >
                        Banner Status
                    </label>


                    <select id="bannerStatus">

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>



                <!--==================================================
                SAVE BUTTON
                ==================================================-->

                <button
                    type="submit"
                    id="saveBannerBtn"
                    class="save-banner-btn"
                >

                    <i class="fa-solid fa-cloud-arrow-up"></i>

                    Upload & Save Banner

                </button>


                <!--==================================================
                MESSAGE
                ==================================================-->

                <div
                    id="bannerMessage"
                    class="banner-message"
                ></div>


            </form>

        </section>



        <!--==================================================
        FEATURE — BANNER MANAGEMENT
        SAVED BANNERS
        ==================================================-->

        <section class="banner-list-card">

            <div class="card-heading">

                <div class="heading-icon">

                    <i class="fa-solid fa-images"></i>

                </div>

                <div>

                    <h2>
                        Saved Banners
                    </h2>

                    <p>
                        Manage your homepage banners
                    </p>

                </div>

            </div>


            <div
                id="bannerList"
                class="banner-list"
            >

                <p class="empty-message">
                    Loading banners...
                </p>

            </div>

        </section>


    </main>


</div>



<!--==================================================
SMARTBAZAAR PRO
FEATURE — BANNER MANAGEMENT
JAVASCRIPT
==================================================-->

<script
    type="module"
    src="banner-manager.js"
></script>


</body>

</html>
