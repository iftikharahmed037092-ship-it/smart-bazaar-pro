<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Bazaar Pro Website Builder</title>

    <link rel="stylesheet" href="smartbazaar-editor.css">

</head>


<body>


    <!-- یہاں ہمارا پورا No-Code Editor بنے گا -->


  <!-- ==========================================
SMARTBAZAAR PRO
NO CODE WEBSITE BUILDER
HEADER BAR
FEATURE 1 - 10
========================================== -->


<header class="sb-editor-header">


    <!-- ==========================
    FEATURE 1
    LOGO + NAME
    ========================== -->

    <a href="#" class="sb-editor-logo">

        <img 
        src="assets/images/logo.png" 
        alt="SmartBazaar Pro Logo">

        <span>
            SmartBazaar Pro
        </span>

    </a>



    <!-- ==========================
    FEATURE 2,3,4
    DEVICE PREVIEW
    ========================== -->

    <div class="sb-device-preview">


        <!-- Desktop Preview -->

        <button 
        class="sb-device-btn active"
        id="desktopMode"
        data-device="desktop">

            <span>
                🖥
            </span>

            Desktop

        </button>



        <!-- Tablet Preview -->

        <button 
        class="sb-device-btn"
        id="tabletMode"
        data-device="tablet">

            <span>
                📱
            </span>

            Tablet

        </button>



        <!-- Mobile Preview -->

        <button 
        class="sb-device-btn"
        id="mobileMode"
        data-device="mobile">

            <span>
                📲
            </span>

            Mobile

        </button>


    </div>





    <!-- ==========================
    FEATURE 5 - 10
    ACTION BUTTONS
    ========================== -->


    <div class="sb-editor-actions">



        <!-- Feature 5
        Undo Button -->

        <button 
        class="sb-action-btn"
        id="undoButton"
        data-action="undo">

            Undo

        </button>





        <!-- Feature 6
        Redo Button -->

        <button 
        class="sb-action-btn"
        id="redoButton"
        data-action="redo">

            Redo

        </button>





        <!-- Feature 7
        Preview Button -->

        <button 
        class="sb-action-btn"
        id="previewButton"
        data-action="preview">

            Preview

        </button>





        <!-- Feature 8
        Save Button -->

        <button 
        class="sb-action-btn"
        id="saveButton"
        data-action="save">

            Save

        </button>





        <!-- Feature 9
        Export Button -->

        <button 
        class="sb-action-btn"
        id="exportButton"
        data-action="export">

            Export

        </button>





        <!-- Feature 10
        Settings Button -->

        <button 
        class="sb-action-btn"
        id="settingsButton"
        data-action="settings">

            Settings

        </button>



    </div>



</header>
<!-- ==========================================
SMARTBAZAAR PRO
NO CODE WEBSITE BUILDER
LEFT PANEL
FEATURE 11 - 20
========================================== -->


<aside class="sb-left-panel">



    <!-- ==========================
    FEATURE 11
    ADD ELEMENTS TAB
    ========================== -->


    <div class="sb-panel-tab active">

        <span class="tab-icon">
            +
        </span>

        <span>
            Add Elements
        </span>

    </div>




    <!-- ELEMENTS LIST -->

    <div class="sb-elements-list">



        <!-- ==========================
        FEATURE 12
        TEXT ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="text">

            <span>
                T
            </span>

            Text

        </button>





        <!-- ==========================
        FEATURE 13
        HEADING ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="heading">

            <span>
                H
            </span>

            Heading

        </button>





        <!-- ==========================
        FEATURE 14
        IMAGE ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="image">

            <span>
                🖼
            </span>

            Image

        </button>





        <!-- ==========================
        FEATURE 15
        BUTTON ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="button">

            <span>
                🔘
            </span>

            Button

        </button>





        <!-- ==========================
        FEATURE 16
        ICON ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="icon">

            <span>
                ⭐
            </span>

            Icon

        </button>





        <!-- ==========================
        FEATURE 17
        VIDEO ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="video">

            <span>
                ▶
            </span>

            Video

        </button>





        <!-- ==========================
        FEATURE 18
        CONTAINER ELEMENT
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="container">

            <span>
                □
            </span>

            Container

        </button>





        <!-- ==========================
        FEATURE 19
        FLEX CONTAINER
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="flex-container">

            <span>
                ↔
            </span>

            Flex Container

        </button>





        <!-- ==========================
        FEATURE 20
        GRID CONTAINER
        ========================== -->


        <button 
        class="sb-element-item"
        data-element="grid-container">

            <span>
                ▦
            </span>

            Grid Container

        </button>




    </div>



</aside>


    <!-- ==========================================
SMARTBAZAAR PRO
NO CODE WEBSITE BUILDER
LEFT PANEL
FEATURE 21 - 28
========================================== -->


<!-- Divider Element -->

<button 
class="sb-element-item"
data-element="divider">

    <span>
        ━
    </span>

    Divider

</button>



<!-- Spacer Element -->

<button 
class="sb-element-item"
data-element="spacer">

    <span>
        ↕
    </span>

    Spacer

</button>



<!-- Form Element -->

<button 
class="sb-element-item"
data-element="form">

    <span>
        📝
    </span>

    Form

</button>



<!-- Product Card Element -->

<button 
class="sb-element-item"
data-element="product-card">

    <span>
        🛒
    </span>

    Product Card

</button>



<!-- News Grid Section -->

<button 
class="sb-element-item"
data-element="news-grid">

    <span>
        📰
    </span>

    News Grid

</button>



<!-- Pages Tab -->

<div class="sb-panel-tab">

    <span class="tab-icon">
        📄
    </span>

    <span>
        Pages
    </span>

</div>



<!-- Templates Tab -->

<div class="sb-panel-tab">

    <span class="tab-icon">
        🎨
    </span>

    <span>
        Templates
    </span>

</div>



<!-- Media Library Tab -->

<div class="sb-panel-tab">

    <span class="tab-icon">
        🖼
    </span>

    <span>
        Media Library
    </span>

</div>
    
  
  <script src="smartbazaar-editor.js"></script>

</body>

</html>
