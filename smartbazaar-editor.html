<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBazaar Pro - Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Header & Primary Controls (Module 2) -->
    <header id="editor-header">
        <div class="logo-area">
            <h2>⚡ SmartBazaar Pro</h2>
        </div>
        <div class="device-switcher">
            <button id="btn-desktop" class="active">💻 Desktop</button>
            <button id="btn-tablet">📱 Tablet</button>
            <button id="btn-mobile">📱 Mobile</button>
        </div>
        <div class="header-actions">
            <button id="btn-undo">↩ Undo</button>
            <button id="btn-redo">↪ Redo</button>
            <button id="btn-preview">👁 Preview</button>
            <button id="btn-save" class="primary">💾 Save</button>
            <button id="btn-export">📦 Export</button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div id="editor-workspace">

        <!-- 2. Left Sidebar: Add Elements & Layers (Module 1, 3, 5) -->
        <aside id="left-sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-target="elements-tab">Elements</button>
                <button class="tab-btn" data-target="layers-tab">Layers</button>
            </div>
            
            <!-- Elements Tab Content -->
            <div id="elements-tab" class="tab-content active">
                <h3>Add Elements</h3>
                <input type="text" id="element-search" placeholder="Search elements...">
                <div class="elements-list">
                    <div class="draggable-item" draggable="true" data-type="heading">📌 Heading Element</div>
                    <div class="draggable-item" draggable="true" data-type="text">paragraph Text Element</div>
                    <div class="draggable-item" draggable="true" data-type="button">🔘 Button Element</div>
                    <div class="draggable-item" draggable="true" data-type="image">🖼 Image Element</div>
                    <div class="draggable-item" draggable="true" data-type="container">📦 Container Box</div>
                    <div class="draggable-item" draggable="true" data-type="product-card">🛍 Product Card</div>
                </div>
            </div>

            <!-- Layers Tab Content -->
            <div id="layers-tab class="tab-content">
                <h3>Layers Tree</h3>
                <div id="layers-tree-view">
                    <!-- Dynamic Layers will be appended here via JS -->
                </div>
            </div>
        </aside>

        <!-- 3. Center: Live Preview Canvas (Module 1, 4) -->
        <main id="canvas-container">
            <div id="live-canvas">
                <!-- Drop elements here -->
                <div class="placeholder-text">Drag & Drop Elements Here to Build Your Page</div>
            </div>
        </main>

        <!-- 4. Right Sidebar: Properties & Style Panel (Module 6, 7, 8, 9) -->
        <aside id="right-sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-target="content-panel">Content</button>
                <button class="tab-btn" data-target="style-panel">Style</button>
            </div>

            <!-- Content Panel -->
            <div id="content-panel" class="tab-content active">
                <h3>Content Properties</h3>
                <div class="prop-group">
                    <label>Text Content</label>
                    <input type="text" id="prop-text-input" placeholder="Enter text...">
                </div>
            </div>

            <!-- Style Panel -->
            <div id="style-panel" class="tab-content">
                <h3>Style & Design</h3>
                <div class="prop-group">
                    <label>Background Color</label>
                    <input type="color" id="prop-bg-color">
                </div>
                <div class="prop-group">
                    <label>Font Size (px)</label>
                    <input type="number" id="prop-font-size">
                </div>
                <div class="prop-group">
                    <label>Border Radius (px)</label>
                    <input type="number" id="prop-border-radius">
                </div>
            </div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
