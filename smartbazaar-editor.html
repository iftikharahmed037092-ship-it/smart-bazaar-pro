<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>SMARTBAZAAR PRO — Code Studio</title>

<link rel="stylesheet" href="smartbazaar-editor.css">

</head>

<body>

<!-- ==================================================
SMARTBAZAAR PRO
FEATURES:
29 Live Preview Canvas
11 Add Elements Tab
34 Content Tab
35 Style Tab
50 Layers Panel
48 Element ID / Class
92 Element Rename
90 Element Lock
91 Element Hide
93 Element Search
100 Grid / Guides
99 Rulers
================================================== -->


<div class="app">


<!-- ==================================================
HEADER
FEATURE 1 — Logo
FEATURE 2 — Desktop Preview
FEATURE 3 — Tablet Preview
FEATURE 4 — Mobile Preview
FEATURE 5 — Undo
FEATURE 6 — Redo
FEATURE 7 — Preview
FEATURE 8 — Save
FEATURE 10 — Settings
================================================== -->

<header class="topbar">

    <div class="brand">
        <span class="brand-icon">&lt;/&gt;</span>

        <div>
            <strong>SMARTBAZAAR</strong>
            <small>PRO CODE STUDIO</small>
        </div>
    </div>


    <div class="history-controls">

        <button id="undoBtn">↶</button>
        <button id="redoBtn">↷</button>

    </div>


    <div class="device-controls">

        <button class="device active"
                data-device="desktop">
            Desktop
        </button>

        <button class="device"
                data-device="tablet">
            Tablet
        </button>

        <button class="device"
                data-device="mobile">
            Mobile
        </button>

    </div>


    <div class="top-actions">

        <button id="previewBtn">
            Preview
        </button>

        <button id="saveBtn">
            Save
        </button>

        <button id="settingsBtn">
            ⚙
        </button>

    </div>

</header>



<!-- ==================================================
MAIN BUILDER
================================================== -->

<div class="builder">


<!-- ==================================================
LEFT SIDEBAR
FEATURE 11 — Add Elements Tab
FEATURE 50 — Layers Panel
FEATURE 93 — Element Search
================================================== -->

<aside class="left-sidebar">


    <div class="sidebar-tabs">

        <button class="left-tab active"
                data-left="elements">
            Elements
        </button>

        <button class="left-tab"
                data-left="layers">
            Layers
        </button>

    </div>


    <!-- ELEMENTS -->

    <section id="elementsPanel"
             class="left-content">


        <input
            id="elementSearch"
            class="search"
            type="search"
            placeholder="Search elements...">

<!--==================================================
FEATURE 11 — ADD ELEMENTS TAB
==================================================-->

<section id="elementsPanel"
         class="left-content">

    <button
        id="addElementMain"
        class="add-element-main">

        <span>＋</span>

        <span>
            Add Element
        </span>

    </button>


    <input
        id="elementSearch"
        class="search"
        type="search"
        placeholder="Search elements...">


    <div class="elements-list">


        <div class="element"
             draggable="true"
             data-type="heading"
             data-name="Heading">

            <span>H</span>
            <b>Heading</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="text"
             data-name="Text">

            <span>T</span>
            <b>Text</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="image"
             data-name="Image">

            <span>▧</span>
            <b>Image</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="button"
             data-name="Button">

            <span>▣</span>
            <b>Button</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="icon"
             data-name="Icon">

            <span>★</span>
            <b>Icon</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="container"
             data-name="Container">

            <span>□</span>
            <b>Container</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="flex"
             data-name="Flex Container">

            <span>↔</span>
            <b>Flex</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="grid"
             data-name="Grid Container">

            <span>▦</span>
            <b>Grid</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="divider"
             data-name="Divider">

            <span>━</span>
            <b>Divider</b>

        </div>


        <div class="element"
             draggable="true"
             data-type="spacer"
             data-name="Spacer">

            <span>↕</span>
            <b>Spacer</b>

        </div>


    </div>

</section>



    <!-- LAYERS -->

    <section id="layersPanel"
             class="left-content hidden">

        <div class="layers-header">

            <strong>Layers</strong>

            <button id="refreshLayers">
                ↻
            </button>

        </div>

        <div id="layersList"></div>

    </section>

</aside>



<!-- ==================================================
CENTER CANVAS
FEATURE 29 — Live Preview
FEATURE 30 — Drag & Drop
FEATURE 31 — Resize foundation
FEATURE 33 — Alignment foundation
FEATURE 99 — Rulers
FEATURE 100 — Grid / Guides
================================================== -->

<main class="workspace">


    <div class="canvas-toolbar">


        <div>

            <button id="gridBtn">
                Grid
            </button>

            <button id="rulerBtn">
                Rulers
            </button>

        </div>


        <strong>
            Live Preview
        </strong>


        <div>

            <button id="zoomOut">
                −
            </button>

            <span id="zoomValue">
                100%
            </span>

            <button id="zoomIn">
                +
            </button>

        </div>

    </div>



    <div id="canvasArea"
         class="canvas-area">


        <div id="rulerTop"
             class="ruler-top"></div>


        <div id="rulerLeft"
             class="ruler-left"></div>


        <div id="preview"
             class="preview">


            <div id="dropMessage"
                 class="drop-message">

                <div class="drop-plus">
                    +
                </div>

                <h2>
                    Start Building
                </h2>

                <p>
                    Drag an element here
                    or click an element
                </p>

            </div>


        </div>

    </div>

</main>



<!-- ==================================================
RIGHT SIDEBAR
FEATURE 34 — Content Tab
FEATURE 35 — Style Tab
FEATURE 48 — ID / Class
FEATURE 92 — Rename
FEATURE 90 — Lock
FEATURE 91 — Hide
================================================== -->

<aside class="right-sidebar">


    <div class="right-tabs">

        <button class="right-tab active"
                data-right="content">
            Content
        </button>

        <button class="right-tab"
                data-right="style">
            Style
        </button>

    </div>



    <!-- CONTENT -->

    <section id="contentPanel"
             class="right-content">


        <div class="field">

            <label>
                Element Name
            </label>

            <input
                id="elementName"
                type="text">

        </div>


        <div class="field">

            <label>
                Element ID
            </label>

            <input
                id="elementId"
                type="text"
                placeholder="my-element">

        </div>


        <div class="field">

            <label>
                CSS Class
            </label>

            <input
                id="elementClass"
                type="text"
                placeholder="custom-class">

        </div>


        <div class="field">

            <label>
                Text / Content
            </label>

            <textarea
                id="contentInput"></textarea>

        </div>


        <div class="element-actions">

            <button id="duplicateBtn">
                Duplicate
            </button>

            <button id="copyStyleBtn">
                Copy Style
            </button>

            <button id="pasteStyleBtn">
                Paste Style
            </button>

        </div>


        <div class="element-actions">

            <button id="lockBtn">
                Lock
            </button>

            <button id="hideBtn">
                Hide
            </button>

        </div>


        <button id="deleteBtn"
                class="danger">
            Delete Element
        </button>

    </section>



    <!-- STYLE -->

    <section id="stylePanel"
             class="right-content hidden">


        <div class="field">

            <label>
                Font Size
            </label>

            <input
                id="fontSize"
                type="number"
                value="20">

        </div>


        <div class="field">

            <label>
                Text Color
            </label>

            <input
                id="textColor"
                type="color"
                value="#111827">

        </div>


        <div class="field">

            <label>
                Background
            </label>

            <input
                id="background"
                type="color"
                value="#ffffff">

        </div>


        <div class="field">

            <label>
                Padding
            </label>

            <input
                id="padding"
                type="number"
                value="10">

        </div>


        <div class="field">

            <label>
                Margin
            </label>

            <input
                id="margin"
                type="number"
                value="8">

        </div>


        <div class="field">

            <label>
                Border Width
            </label>

            <input
                id="borderWidth"
                type="number"
                value="0">

        </div>


        <div class="field">

            <label>
                Border Radius
            </label>

            <input
                id="radius"
                type="number"
                value="10">

        </div>


        <div class="field">

            <label>
                Shadow
            </label>

            <select id="shadow">

                <option value="none">
                    None
                </option>

                <option value="small">
                    Small
                </option>

                <option value="medium">
                    Medium
                </option>

                <option value="large">
                    Large
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Position
            </label>

            <select id="position">

                <option value="static">
                    Static
                </option>

                <option value="relative">
                    Relative
                </option>

                <option value="absolute">
                    Absolute
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Display
            </label>

            <select id="display">

                <option value="block">
                    Block
                </option>

                <option value="flex">
                    Flex
                </option>

                <option value="grid">
                    Grid
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Width
            </label>

            <input
                id="width"
                type="text"
                value="auto">

        </div>


        <div class="field">

            <label>
                Height
            </label>

            <input
                id="height"
                type="text"
                value="auto">

        </div>


        <div class="field">

            <label>
                Overflow
            </label>

            <select id="overflow">

                <option value="visible">
                    Visible
                </option>

                <option value="hidden">
                    Hidden
                </option>

                <option value="auto">
                    Auto
                </option>

            </select>

        </div>

    </section>

</aside>

</div>



<!-- ==================================================
CODE STUDIO
FEATURE 187 — Code Editor
FEATURE 47 — Custom CSS Box
================================================== -->

<section class="code-studio">


    <div class="code-header">

        <strong>
            Code Studio
        </strong>


        <div class="code-tabs">

            <button
                class="code-tab active"
                data-code="html">
                HTML
            </button>

            <button
                class="code-tab"
                data-code="css">
                CSS
            </button>

            <button
                class="code-tab"
                data-code="js">
                JavaScript
            </button>

        </div>


        <button id="runCode">
            Run Code
        </button>

    </div>


    <div class="code-area">


        <textarea
            id="htmlCode"
            class="code-input"
            spellcheck="false"></textarea>


        <textarea
            id="cssCode"
            class="code-input hidden"
            spellcheck="false"></textarea>


        <textarea
            id="jsCode"
            class="code-input hidden"
            spellcheck="false"></textarea>

    </div>


    <div class="code-status">

        <span>
            ● Live Code
        </span>

        <span id="saveStatus">
            Ready
        </span>

    </div>

</section>


</div>


<script src="smartbazaar-editor.js"></script>

</body>
</html>
