<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Activity - SmartBazaar Pro</title>
    <link rel="stylesheet" href="login-activity۔css">
    <!--link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"-->
</head>
<body>

    <div class="security-container">
        <h2>Login Activity</h2>
        <p class="desc">Review the devices currently or recently logged into your account.</p>

        <div class="activity-list">
            <!-- ایکٹیوٹی کا پہلا ریکارڈ -->
            <div class="activity-item">
                <i class="fas fa-mobile-alt"></i>
                <div class="info">
                    <strong>Android - Chrome</strong>
                    <span>Pakistan • Just now</span>
                </div>
            </div>

            <!-- ایکٹیوٹی کا دوسرا ریکارڈ -->
            <div class="activity-item">
                <i class="fas fa-desktop"></i>
                <div class="info">
                    <strong>Windows - Chrome</strong>
                    <span>Pakistan • 2 days ago</span>
                </div>
            </div>
        </div>

        <a href="security.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Security</a>
    </div>

</body>
</html>
