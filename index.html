<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="SmartBazaar Pro - Multi Vendor Marketplace">

<meta name="keywords" content="Marketplace, Ecommerce, SmartBazaar">

<meta name="author" content="Iftikhar Ahmed">

<title>SmartBazaar Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header id="header">

    <!--==============================
TOP BAR START
==============================-->

<div class="top-bar">

    <div class="container">

        <!-- Left Side -->
        <div class="top-left">

            <a href="#" class="top-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Deliver To Pakistan</span>
            </a>

        </div>

        <!-- Right Side -->
        <div class="top-right">

            <a href="#" class="top-item">
                <i class="fa-solid fa-globe"></i>
                <span>English</span>
            </a>

            <a href="#" class="top-item">
                <i class="fa-solid fa-box"></i>
                <span>Track Order</span>
            </a>

            <a href="#" class="top-item">
                <i class="fa-solid fa-store"></i>
                <span>Sell on SmartBazaar</span>
            </a>

            <a href="#" class="top-item">
                <i class="fa-solid fa-circle-question"></i>
                <span>Help & Support</span>
            </a>

            <a href="#" class="top-item">
                <i class="fa-solid fa-phone"></i>
                <span>Contact</span>
            </a>

        </div>

    </div>

</div>

<!--==============================
TOP BAR END
==============================-->

    <!--=================================
MAIN HEADER START
==================================-->

<div class="main-header">

    <div class="container">

        <!-- Left -->

        <div class="header-left">

            <!-- Mobile Menu -->
            <button class="menu-btn">

                <i class="fa-solid fa-bars"></i>

            </button>

            <!-- Logo -->

            <a href="#" class="logo">

                <span class="logo-icon">
                    <i class="fa-solid fa-store"></i>
                </span>

                <span class="logo-text">

                    SmartBazaar <strong>Pro</strong>

                </span>

            </a>

        </div>

        <!-- Center -->

        <div class="header-center">

        
            <!--==============================
SEARCH BAR START
==============================-->

<form class="search-form">

    <!-- Categories -->

    <select class="search-category">

        <option>All Categories</option>

        <option>Electronics</option>

        <option>Fashion</option>

        <option>Mobiles</option>

        <option>Computers</option>

        <option>Home & Kitchen</option>

        <option>Beauty</option>

        <option>Sports</option>

    </select>

    <!-- Search Input -->

    <input
    type="text"
    class="search-input"
    placeholder="Search products, brands and categories...">

    <!-- Search Button -->

    <button
    type="submit"
    class="search-btn">

        <i class="fa-solid fa-magnifying-glass"></i>

    </button>

</form>

<!--==============================
SEARCH BAR END
==============================-->

        </div>

        <!-- Right -->

        <div class="header-right">

            <!--==============================
ACCOUNT
==============================-->

<a href="#" class="header-action">

    <div class="action-icon">

        <i class="fa-regular fa-user"></i>

    </div>

    <div class="action-content">

        <small>Hello, Sign In</small>

        <strong>Account</strong>

    </div>

</a>

<!--==============================
WISHLIST
==============================-->

<a href="#" class="header-action">

    <div class="action-icon">

        <i class="fa-regular fa-heart"></i>

        <span class="badge">0</span>

    </div>

    <div class="action-content">

        <small>My</small>

        <strong>Wishlist</strong>

    </div>

</a>

<!--==============================
NOTIFICATIONS
==============================-->

<a href="#" class="header-action">

    <div class="action-icon">

        <i class="fa-regular fa-bell"></i>

        <span class="badge">0</span>

    </div>

    <div class="action-content">

        <small>Latest</small>

        <strong>Alerts</strong>

    </div>

</a>

<!--==============================
CART
==============================-->

<a href="#" class="header-action">

    <div class="action-icon">

        <i class="fa-solid fa-cart-shopping"></i>

        <span class="badge">0</span>

    </div>

    <div class="action-content">

        <small>Shopping</small>

        <strong>Cart</strong>

    </div>

</a>

        </div>

    </div>

</div>

<!--=================================
MAIN HEADER END
==================================-->

    <!-- Navigation -->
    <nav class="navbar"></nav>

</header>

<main>

</main>

<script src="script.js"></script>

</body>
</html>
