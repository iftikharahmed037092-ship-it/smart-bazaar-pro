<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bazaar Pro - Buy & Sell Anything</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-left">Deliver to: <span>Location</span></div>
    <div class="top-right">
      <a href="#">Sell on Smart Bazaar Pro</a>
      <a href="#">Track Order</a>
      <a href="#">Help & Support</a>
    </div>
  </div>

  <!-- MAIN HEADER -->
  <header class="main-header">
    <div class="logo">🛒 <span>Smart</span>Bazaar Pro</div>
    
    <div class="search-box">
      <input type="text" placeholder="Search for products, brands and more...">
      <select><option>All Categories</option></select>
      <button class="search-btn">🔍</button>
    </div>

    <div class="header-icons">
      <a href="#">👤<span>Login / Signup</span></a>
      <a href="#">❤️<span>Wishlist</span></a>
      <a href="#">🛒<span>Cart</span></a>
    </div>

    <button class="mobile-menu-btn">☰</button>
  </header>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="all-categories">☰ All Categories</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Deals</a>
      <a href="#">Top Sellers</a>
      <a href="#">New Arrivals</a>
      <a href="#">Brands</a>
      <a href="#">Stores</a>
    </div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
