<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Language Settings - SmartBazaar Pro">

    <title>Language - SmartBazaar Pro</title>

    <!--
    ==================================================
    SMARTBAZAAR PRO
    LANGUAGE SETTINGS PAGE
    FEATURE: Language
    ==================================================
    -->

    <link rel="stylesheet" href="language.css">

</head>

<body>

    <!--================================================
    LANGUAGE PAGE
    FEATURE: Language
    ================================================-->

    <main class="language-page">


        <!--============================================
        PAGE HEADER
        ============================================-->

        <section class="language-header">

            <a
                href="account.html"
                class="back-button"
                aria-label="Go back">

                ←

            </a>

            <div class="header-content">

                <div class="header-icon">
                    🌐
                </div>

                <div>

                    <h1>Language</h1>

                    <p>
                        Choose your preferred language
                    </p>

                </div>

            </div>

        </section>


        <!--============================================
        LANGUAGE CONTAINER
        ============================================-->

        <section class="language-container">


            <!--========================================
            CURRENT LANGUAGE
            ========================================-->

            <div class="current-language">

                <div class="current-language-info">

                    <div class="language-icon">
                        🌐
                    </div>

                    <div>

                        <span class="small-label">
                            Current Language
                        </span>

                        <h2>English</h2>

                        <p>
                            English
                        </p>

                    </div>

                </div>

                <span class="active-badge">
                    Active
                </span>

            </div>


            <!--========================================
            AVAILABLE LANGUAGES
            ========================================-->

            <div class="language-section">

                <div class="section-heading">

                    <h2>Available Languages</h2>

                    <p>
                        Select the language you want to use
                    </p>

                </div>


                <div class="language-list">


                    <!-- ENGLISH -->

                    <label class="language-option selected">

                        <input
                            type="radio"
                            name="language"
                            value="en"
                            checked>

                        <div class="language-option-content">

                            <div class="language-flag">
                                🇬🇧
                            </div>

                            <div>

                                <h3>English</h3>

                                <p>
                                    English
                                </p>

                            </div>

                        </div>

                        <span class="radio-check"></span>

                    </label>


                    <!-- URDU -->

                    <label class="language-option">

                        <input
                            type="radio"
                            name="language"
                            value="ur">

                        <div class="language-option-content">

                            <div class="language-flag">
                                🇵🇰
                            </div>

                            <div>

                                <h3>اردو</h3>

                                <p>
                                    Urdu
                                </p>

                            </div>

                        </div>

                        <span class="radio-check"></span>

                    </label>


                    <!-- ARABIC -->

                    <label class="language-option">

                        <input
                            type="radio"
                            name="language"
                            value="ar">

                        <div class="language-option-content">

                            <div class="language-flag">
                                🇸🇦
                            </div>

                            <div>

                                <h3>العربية</h3>

                                <p>
                                    Arabic
                                </p>

                            </div>

                        </div>

                        <span class="radio-check"></span>

                    </label>


                    <!-- PUNJABI -->

                    <label class="language-option">

                        <input
                            type="radio"
                            name="language"
                            value="pa">

                        <div class="language-option-content">

                            <div class="language-flag">
                                🇵🇰
                            </div>

                            <div>

                                <h3>پنجابی</h3>

                                <p>
                                    Punjabi
                                </p>

                            </div>

                        </div>

                        <span class="radio-check"></span>

                    </label>

                </div>

            </div>


            <!--========================================
            LANGUAGE INFORMATION
            ========================================-->

            <div class="language-note">

                <span class="note-icon">
                    ℹ️
                </span>

                <p>
                    Changing the language will update the
                    language used throughout your SmartBazaar
                    account.
                </p>

            </div>


            <!--========================================
            ACTIONS
            ========================================-->

            <div class="language-actions">

                <button
                    type="button"
                    class="cancel-btn">

                    Cancel

                </button>

                <button
                    type="button"
                    class="save-language-btn">

                    Save Language

                </button>

            </div>

        </section>

    </main>

</body>

</html>
